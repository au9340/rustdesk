# 仅 Android 的发布流水线（精简自上游 flutter-build.yml 的 build-rustdesk-android）。
#
# 触发：任意分支 push 都会构建，Actions 页面也可手动 Run workflow。
#       → 想只让某条分支生效，把 `on.push` 换回 `branches: [android-release]`。
#
# 产物：单个 arm64-v8a APK，签名后直接建 Release。
#
# 「可覆盖更新」需要同时满足两个条件，这里都保证了：
#   1. 每次用同一把 keystore 签名（secrets.ANDROID_SIGNING_KEY），
#   2. versionCode 单调递增（用 github.run_number 作为 --build-number）。
#   ⚠ 如果手机上装的是官方 RustDesk（官方 keystore 签的），首次必须卸载重装，
#     签名不同无法覆盖；之后所有自编译版本之间可以互相覆盖。
#
# 需要的仓库 Secrets（Settings → Secrets and variables → Actions）：
#   ANDROID_SIGNING_KEY         = base64 -w0 后的 keystore 文件内容
#   ANDROID_KEY_STORE_PASSWORD  = keystore 密码
#   ANDROID_KEY_PASSWORD        = key 密码
#   ANDROID_ALIAS               = key 别名
#
# 生成 keystore：
#   keytool -genkeypair -v -keystore release.jks -alias rustdesk \
#     -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12
#   base64 -w0 release.jks      # 把输出贴进 ANDROID_SIGNING_KEY
#   备份 release.jks —— 丢了就再也不能覆盖更新，只能卸载重装。

name: Android Release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # 带上 ref，不同分支互不干扰；同一分支保持串行，避免发布出半成品
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: "1.5.1"
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_VERSION: "3.24.5"
  NDK_VERSION: "r28c"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  # 复用上游的 bridge 生成（src/bridge_generated*.rs 与 flutter/lib/generated_bridge*.dart 是
  # 构建产物，仓库里没有，必须先跑 flutter_rust_bridge_codegen）。
  bridge:
    uses: ./.github/workflows/bridge.yml

  build-android:
    needs: [bridge]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free disk space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache env (vcpkg binary cache)
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               wget

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.FLUTTER_VERSION }}

      # 上游对 Flutter 3.24.5 打的一个 dropdown 补丁，不打会编译失败。
      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Setup NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      # 编译 Android 依赖（libvpx/ffmpeg/openssl/aom 等），走 vcpkg，缓存命中时会快很多。
      - name: Build Android deps (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: ./flutter/build_android_deps.sh arm64-v8a

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: android-arm64

      - name: Build librustdesk.so (arm64-v8a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ./flutter/ndk_arm64.sh

          mkdir -p flutter/android/app/src/main/jniLibs/arm64-v8a
          cp target/aarch64-linux-android/release/liblibrustdesk.so \
             flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          cp "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so" \
             flutter/android/app/src/main/jniLibs/arm64-v8a/

      # 关键：不要像上游那样把 signingConfigs.release 改成 debug。
      # build.gradle 本来就支持从 flutter/android/key.properties 读 release 签名，
      # 只要把固定 keystore 写进去，产出的 APK 每次签名一致，才能覆盖安装。
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEY }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "::error::缺少签名密钥，无法产出可覆盖安装的 APK。"
            echo "::error::请在 Settings → Secrets and variables → Actions 添加："
            echo "::error::  ANDROID_SIGNING_KEY / ANDROID_KEY_STORE_PASSWORD / ANDROID_KEY_PASSWORD / ANDROID_ALIAS"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/release.jks"
          cat > flutter/android/key.properties <<EOF
          storePassword=${STORE_PASSWORD}
          keyPassword=${KEY_PASSWORD}
          keyAlias=${KEY_ALIAS}
          storeFile=$GITHUB_WORKSPACE/release.jks
          EOF
          sed 's/^/  /' flutter/android/key.properties | sed 's/\(storePassword=\).*/\1***/;s/\(keyPassword=\).*/\1***/'

      - name: Build signed arm64 APK
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
          VERSION_CODE: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$JAVA_HOME/bin:$PATH"
          # Gradle 默认 1G 堆，大项目容易 OOM
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx4g/g" ./flutter/android/gradle.properties
          pushd flutter
          flutter build apk --release \
            --target-platform android-arm64 \
            --build-name="${VERSION}" \
            --build-number="${VERSION_CODE}"
          popd
          mkdir -p out
          cp ./flutter/build/app/outputs/flutter-apk/app-release.apk \
             ./out/RustDesk-android-arm64.apk
          ls -lh ./out

      - name: Verify signature and versionCode
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* | sort -V | tail -1)
          echo "build-tools: $BT"
          "$BT/apksigner" verify --print-certs ./out/RustDesk-android-arm64.apk | tee /tmp/certs.txt
          # 证书 SHA-256 应当每次构建都一样；不一样说明 keystore 变了，无法覆盖更新
          grep -i 'SHA-256 digest' /tmp/certs.txt
          "$BT/aapt" dump badging ./out/RustDesk-android-arm64.apk | head -1

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rustdesk-android-arm64
          path: ./out/RustDesk-android-arm64.apk
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
        with:
          # 每次构建一个新 tag，避免复用 tag 引起的冲突；
          # 资产名固定，所以 releases/latest/download 的链接永远指向最新一版。
          tag_name: android-b${{ github.run_number }}
          name: RustDesk Android b${{ github.run_number }}
          make_latest: true
          prerelease: false
          fail_on_unmatched_files: true
          body: |
            RustDesk Android 自编译版（直接安装，可覆盖上一版）

            - 版本名：`${{ env.VERSION }}`
            - versionCode：`${{ github.run_number }}`
            - ABI：arm64-v8a
            - 分支：`${{ github.ref_name }}`
            - 提交：${{ github.sha }}

            固定下载地址（永远是最新版）：
            `https://github.com/${{ github.repository }}/releases/latest/download/RustDesk-android-arm64.apk`

            覆盖安装前提：与上一版使用同一把签名密钥，且 versionCode 不小于已安装版本。
          files: ./out/RustDesk-android-arm64.apk
